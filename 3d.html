<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#1f6feb" />
    <link rel="icon" href="./hummingbird.png" type="image/png" />
    <link rel="apple-touch-icon" href="./hummingbird-touch.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ShapesCraft 3D</title>
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1><img src="./hummingbird.png" alt="" class="logo" width="32" height="32" />ShapesCraft 3D</h1>
        <div class="title-tools">
          <a id="back" href="./index.html" class="link" data-i18n="nav.back"></a>
          <select id="lang" aria-label="Language">
            <option value="en">EN</option>
            <option value="it">IT</option>
          </select>
        </div>
      </div>
      <p class="lead" data-i18n="lead"></p>
      <div class="install">
        <button id="install" type="button" class="secondary" data-i18n="install.button" hidden></button>
        <p id="install-help" class="hint" role="status" hidden></p>
      </div>
    </header>

    <main>
      <section class="card">
        <h2><span class="step">1</span> <span data-i18n="mat.title"></span></h2>
        <div class="segmented mat-choice" role="radiogroup" aria-label="Mat">
          <div>
            <label><input type="radio" name="mat" value="rect" checked /> <span data-i18n="mat.rect"></span></label>
            <label><input type="radio" name="mat" value="round" /> <span data-i18n="mat.round"></span></label>
            <label><input type="radio" name="mat" value="round-a3" /> <span data-i18n="mat.round-a3"></span></label>
            <label><input type="radio" name="mat" value="round-small" /> <span data-i18n="mat.round-small"></span></label>
          </div>
        </div>
        <div class="buttons">
          <button id="share-mat" type="button" data-i18n="mat.share" hidden></button>
          <button id="download-mat" type="button" class="secondary" data-i18n="mat.download"></button>
        </div>
        <p class="hint" data-i18n="mat.hint"></p>
        <p id="round-hint" class="hint" data-i18n="mat.round.hint" hidden></p>
      </section>

      <section class="card">
        <h2><span class="step">2</span> <span data-i18n="photos.title"></span></h2>
        <p class="hint" data-i18n="photos.hint"></p>
        <div class="buttons">
          <label class="button">
            <span data-i18n="video.record"></span>
            <input id="video-camera" type="file" accept="video/*" capture="environment" hidden />
          </label>
          <label class="button secondary">
            <span data-i18n="video.upload"></span>
            <input id="video-upload" type="file" accept="video/*" hidden />
          </label>
        </div>
        <p class="hint photos-alt">
          <label class="link-label"><span data-i18n="photos.upload"></span><input id="upload" type="file" accept="image/*" multiple hidden /></label>
        </p>
        <progress id="progress" max="1" value="0" hidden></progress>
        <p id="status" class="status" role="status"></p>
        <ul id="errors" class="errors"></ul>
      </section>

      <section id="result" class="card" hidden>
        <h2><span class="step">3</span> <span data-i18n="result.title"></span></h2>
        <p id="verdict" class="verdict"></p>
        <p id="summary" class="hint"></p>
        <canvas id="scene" class="scene"></canvas>
        <p class="hint" data-i18n="result.view"></p>
        <canvas id="coverage" class="coverage"></canvas>
        <p class="hint" data-i18n="result.coverage"></p>
        <div class="table-wrap"><table id="table" class="poses"></table></div>
        <div class="buttons">
          <button id="json" type="button" class="secondary" data-i18n="result.json"></button>
          <button id="clear" type="button" class="secondary" data-i18n="photos.clear"></button>
        </div>
      </section>

      <section id="model" class="card" hidden>
        <h2><span class="step">4</span> <span data-i18n="model.title"></span></h2>
        <p class="hint" data-i18n="model.hint"></p>
        <div class="buttons">
          <button id="build-model" type="button" data-i18n="model.build"></button>
        </div>
        <progress id="progress-model" max="1" value="0" hidden></progress>
        <p id="model-empty" class="errors-text" data-i18n="model.empty" hidden></p>
        <div id="model-result" hidden>
          <canvas id="model-view" class="scene"></canvas>
          <p class="hint" data-i18n="model.view"></p>
          <p id="model-size" class="model-size"></p>
          <div class="buttons">
            <button id="stl" type="button" data-i18n="model.stl"></button>
          </div>
          <p class="hint" data-i18n="model.limits"></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span data-i18n="footer.license"></span> ·
      <a href="https://github.com/AleDevi/ShapesCraft" target="_blank" rel="noopener" data-i18n="footer.source"></a>
    </footer>

    <script type="module" src="./src/scan3d/main.ts"></script>
  </body>
</html>
