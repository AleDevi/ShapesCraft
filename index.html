<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#1f6feb" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ShapesCraft</title>
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>ShapesCraft</h1>
        <div class="title-tools">
          <button id="help" type="button" class="link" data-i18n="nav.help" hidden></button>
          <select id="lang" aria-label="Language">
            <option value="en">EN</option>
            <option value="it">IT</option>
          </select>
        </div>
      </div>
    </header>

    <main id="welcome" class="welcome">
      <p class="lead" data-i18n="welcome.lead"></p>
      <ol class="how">
          <li>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 8v20M15 20l9 9 9-9"/><path d="M10 30v8h28v-8"/></svg>
            <div><strong><span class="how-n">1</span> <span data-i18n="how.download"></span></strong><span class="how-text" data-i18n="how.download.text"></span></div>
          </li>
          <li>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 18V8h18v10"/><rect x="8" y="18" width="32" height="14" rx="3"/><path d="M15 28h18v12H15z"/></svg>
            <div><strong><span class="how-n">2</span> <span data-i18n="how.print"></span></strong><span class="how-text" data-i18n="how.print.text"></span></div>
          </li>
          <li>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 16h8l3-5h10l3 5h8v22H8z"/><circle cx="24" cy="26" r="7"/></svg>
            <div><strong><span class="how-n">3</span> <span data-i18n="how.photo"></span></strong><span class="how-text" data-i18n="how.photo.text"></span></div>
          </li>
          <li>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 6h16l8 8v28H13z"/><path d="M29 6v8h8"/><path d="M18 34c3-10 9-10 12-4"/></svg>
            <div><strong><span class="how-n">4</span> <span data-i18n="how.file"></span></strong><span class="how-text" data-i18n="how.file.text"></span></div>
          </li>
      </ol>
      <div class="buttons">
        <button id="start" type="button" class="big" data-i18n="welcome.start"></button>
      </div>
    </main>

    <main id="app" hidden>
      <section class="card">
        <h2><span class="step">1</span> <span data-i18n="frame.title"></span></h2>
        <label class="row">
          <span data-i18n="frame.format"></span>
          <select id="frame"></select>
        </label>
        <div class="buttons">
          <button id="share-frame" type="button" data-i18n="frame.share" hidden></button>
          <button id="download-frame" type="button" class="secondary" data-i18n="frame.download"></button>
          <button id="link-frame" type="button" class="secondary" data-i18n="frame.link"></button>
        </div>
        <p class="hint" data-i18n="frame.hint"></p>
        <p id="frame-status" class="hint" role="status"></p>
      </section>

      <section class="card">
        <h2><span class="step">2</span> <span data-i18n="photo.title"></span></h2>
        <p class="hint" data-i18n="photo.hint"></p>
        <div class="buttons">
          <label class="button">
            <span data-i18n="photo.take"></span>
            <input id="camera" type="file" accept="image/*" capture="environment" hidden />
          </label>
          <label class="button secondary">
            <span data-i18n="photo.upload"></span>
            <input id="upload" type="file" accept="image/*" hidden />
          </label>
        </div>
        <p id="status" class="status" role="status"></p>
      </section>

      <section id="result" class="card" hidden>
        <h2><span class="step">3</span> <span data-i18n="result.title"></span></h2>
        <!-- Pinned while the controls scroll, so every slider's effect stays in view. -->
        <div class="preview-pane">
          <div class="preview-wrap"><div id="preview" class="preview"></div></div>
          <p id="summary" class="summary"></p>
        </div>

        <div class="controls-pane">
        <div class="controls">
          <div class="segmented" role="radiogroup" aria-labelledby="fill-label">
            <span id="fill-label" data-i18n="fill.title"></span>
            <div>
              <label><input type="radio" name="fill" value="outline" checked /> <span data-i18n="fill.outline"></span></label>
              <label><input type="radio" name="fill" value="filled" /> <span data-i18n="fill.filled"></span></label>
            </div>
          </div>
          <small id="fill-hint" class="hint" data-i18n="fill.hint"></small>
          <label>
            <span><span data-i18n="threshold"></span> <output id="threshold-out"></output></span>
            <input id="threshold" type="range" min="0.1" max="0.95" step="0.01" />
          </label>
          <button id="threshold-auto" type="button" class="link" data-i18n="threshold.auto"></button>
          <label>
            <span><span data-i18n="straighten"></span> <output id="tolerance-out"></output></span>
            <input id="tolerance" type="range" min="0.1" max="3" step="0.1" />
            <small class="hint" data-i18n="straighten.hint"></small>
          </label>
          <label>
            <span><span data-i18n="minarea"></span> <output id="minarea-out"></output></span>
            <input id="minarea" type="range" min="0" max="100" step="1" />
          </label>
          <label>
            <span><span data-i18n="smooth"></span> <output id="smooth-out"></output></span>
            <input id="smooth" type="range" min="0" max="10" step="0.5" />
            <small class="hint" data-i18n="smooth.hint"></small>
          </label>
          <label class="check"><input id="centerline" type="checkbox" /> <span data-i18n="centerline"></span></label>
          <small class="hint check-hint" data-i18n="centerline.hint"></small>
          <label class="check"><input id="invert" type="checkbox" /> <span data-i18n="invert"></span></label>
          <label class="check"><input id="show-photo" type="checkbox" checked /> <span data-i18n="show-photo"></span></label>
        </div>

        <div class="buttons">
          <button id="download" type="button" data-i18n="download"></button>
        </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span data-i18n="footer.license"></span> ·
      <a href="https://github.com/AleDevi/ShapesCraft" target="_blank" rel="noopener" data-i18n="footer.source"></a>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
